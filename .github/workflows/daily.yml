name: Daily Rev Ops job scan

on:
  schedule:
    - cron: "17 12 * * *"   # ~8am US Eastern every day (UTC schedule)
  workflow_dispatch:         # "Run workflow" button for an on-demand scan
  push:
    paths: ["config.toml"]   # rescan right after you change the config

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Scan job sources
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m jobtracker

      - name: Show report in run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "revops-job-tracker"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Job scan $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
